name: Build Beget bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package standalone
        run: |
          cp -a public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/content
          cp -a content/articles .next/standalone/content/articles
          tar -czf deeptech-beget.tgz -C .next/standalone .

      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beget-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" deeptech-beget.tgz \
            --title "Beget deploy $TAG" \
            --notes "Linux standalone bundle for Beget deployment."
